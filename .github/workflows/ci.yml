name: Validate beta

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ae-ai-studio-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.sha256
